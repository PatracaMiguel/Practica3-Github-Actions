name: CI - Calculadora Básica

on:
  push:
    branches: [master, feature/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verificar estructura
        run: |
          echo "=== Estructura del proyecto ==="
          ls -la
          echo "=== Código fuente ==="
          ls -la demo/src/main/java/Matematicas/ || echo "No existe directorio Matematicas"
          echo "=== Pruebas ==="
          ls -la demo/src/test/java/ || echo "No existe directorio de pruebas"

      - name: Compilar y ejecutar pruebas con Maven
        run: mvn clean test
        working-directory: ./demo  

      - name: Publicar resultados de pruebas
        if: always()  
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: demo/target/surefire-reports/
